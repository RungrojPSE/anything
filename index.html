<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Common Solvents</title>
<meta name="description" content="60 common laboratory and industrial solvents with CAS numbers, formulas, SMILES and structures.">
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --border: #e3e2de;
    --text: #1d1d1b;
    --muted: #6b6a66;
    --accent: #2f6f5e;
    --accent-soft: #e4efeb;
    --code-bg: #f1f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161716;
      --surface: #1f201f;
      --border: #333432;
      --text: #ecebe7;
      --muted: #a09f9a;
      --accent: #7cc2ad;
      --accent-soft: #23332e;
      --code-bg: #292a28;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161716;
    --surface: #1f201f;
    --border: #333432;
    --text: #ecebe7;
    --muted: #a09f9a;
    --accent: #7cc2ad;
    --accent-soft: #23332e;
    --code-bg: #292a28;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 16px 48px; }
  header h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }
  header a { color: var(--accent); }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin: 24px 0 16px;
  }
  .controls input, .controls select {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
  }
  .controls input { flex: 1 1 240px; min-width: 0; }
  .controls select { flex: 0 1 200px; min-width: 0; }
  .count { color: var(--muted); font-size: 13px; margin-left: auto; }
  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .structure { height: 150px; display: flex; align-items: center; justify-content: center; }
  .structure svg { max-width: 100%; max-height: 100%; }
  .card[hidden] { display: none; }
  .card h2 { margin: 4px 0 0; font-size: 16px; line-height: 1.3; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); }
  .tag {
    align-self: flex-start; font-size: 12px; color: var(--accent);
    background: var(--accent-soft); border-radius: 999px; padding: 1px 8px;
  }
  .smiles {
    display: flex; gap: 6px; align-items: center; margin-top: auto;
    background: var(--code-bg); border-radius: 6px; padding: 4px 4px 4px 8px;
  }
  .smiles code {
    flex: 1; min-width: 0; overflow-wrap: anywhere;
    font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .smiles button {
    font: inherit; font-size: 12px; color: var(--muted); background: none;
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; cursor: pointer;
  }
  .smiles button:hover { color: var(--text); }
  .empty, .error { color: var(--muted); padding: 32px 0; text-align: center; }
  footer { margin-top: 32px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Common Solvents</h1>
    <p>Laboratory and industrial solvents with CAS numbers, formulas and SMILES. <a href="compounds.csv" download>Download CSV</a></p>
  </header>

  <div class="controls">
    <input id="q" type="search" placeholder="Search name, CAS, formula or SMILES" aria-label="Search">
    <select id="cls" aria-label="Filter by class"><option value="">All classes</option></select>
    <span class="count" id="count"></span>
  </div>

  <main class="grid" id="grid"></main>

  <footer>
    SMILES validated with RDKit against each compound's molecular formula.
    Structures drawn with <a href="https://github.com/reymond-group/smilesDrawer">SmilesDrawer</a> (MIT).
  </footer>
</div>

<script src="vendor/smiles-drawer.min.js"></script>
<script>
  // Minimal CSV parser that handles quoted fields such as "1,1,1-Trichloroethane".
  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') quoted = false;
        else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    const [head, ...body] = rows.filter(r => r.some(Boolean));
    return body.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""])));
  }

  // "000071-55-6" -> "71-55-6"
  const cas = s => s.replace(/^0+(?=\d)/, "");

  const grid = document.getElementById("grid");
  const q = document.getElementById("q");
  const cls = document.getElementById("cls");
  const count = document.getElementById("count");
  const dark = matchMedia("(prefers-color-scheme: dark)");
  let compounds = [];

  function theme() {
    const forced = document.documentElement.dataset.theme;
    return forced || (dark.matches ? "dark" : "light");
  }

  function drawStructure(el, smiles) {
    el.replaceChildren();
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    el.append(svg);
    const drawer = new SmilesDrawer.SvgDrawer({
      // Fixed scale keeps bond lengths consistent between cards; CSS shrinks large molecules to fit.
      scale: 1.4, padding: 10, compactDrawing: false,
    });
    SmilesDrawer.parse(smiles, tree => drawer.draw(tree, svg, theme()), () => {
      el.textContent = "Structure unavailable";
    });
  }

  function card(c) {
    const el = document.createElement("article");
    el.className = "card";
    el.innerHTML = `
      <div class="structure"></div>
      <span class="tag"></span>
      <h2></h2>
      <div class="meta"><span class="cas"></span><span class="formula"></span></div>
      <div class="smiles"><code></code><button type="button">Copy</button></div>`;
    el.querySelector(".tag").textContent = c.Class;
    el.querySelector("h2").textContent = c.Name;
    el.querySelector(".cas").textContent = "CAS " + cas(c.CAS);
    el.querySelector(".formula").textContent = c.Formula;
    el.querySelector("code").textContent = c.SMILES;
    const btn = el.querySelector("button");
    btn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(c.SMILES);
        btn.textContent = "Copied";
      } catch { btn.textContent = "Failed"; }
      setTimeout(() => (btn.textContent = "Copy"), 1200);
    });
    c.el = el;
    drawStructure(el.querySelector(".structure"), c.SMILES);
    return el;
  }

  function filter() {
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    for (const c of compounds) {
      const hay = [c.Name, cas(c.CAS), c.CAS, c.Formula, c.SMILES, c.Class].join(" ").toLowerCase();
      const visible = (!term || hay.includes(term)) && (!cls.value || c.Class === cls.value);
      c.el.hidden = !visible;
      if (visible) shown++;
    }
    count.textContent = `${shown} of ${compounds.length}`;
    grid.querySelector(".empty")?.remove();
    if (!shown) grid.insertAdjacentHTML("beforeend", '<p class="empty">No compounds match.</p>');
  }

  fetch("compounds.csv")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(text => {
      compounds = parseCSV(text).sort((a, b) => a.Name.localeCompare(b.Name, undefined, { sensitivity: "base" }));
      for (const name of [...new Set(compounds.map(c => c.Class))].sort()) {
        cls.add(new Option(name, name));
      }
      grid.append(...compounds.map(card));
      filter();
    })
    .catch(() => {
      grid.innerHTML = '<p class="error">Could not load compounds.csv. Serve this folder over HTTP (for example GitHub Pages or <code>python3 -m http.server</code>).</p>';
    });

  q.addEventListener("input", filter);
  cls.addEventListener("change", filter);
  dark.addEventListener("change", () => {
    for (const c of compounds) drawStructure(c.el.querySelector(".structure"), c.SMILES);
  });
</script>
</body>
</html>
